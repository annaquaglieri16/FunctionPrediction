[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plm-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "pyyaml", "requests", "pyarrow", "pyteomics"]

[project.optional-dependencies]
ml = ["torch", "transformers", "sentencepiece"]

[project.scripts]
plm-fetch  = "plm_benchmark.cli.plm_fetch:main"
plm-digest = "plm_benchmark.cli.plm_digest:main"

[tool.setuptools.packages.find]
where = ["src"]